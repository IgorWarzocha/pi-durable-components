name: Publish release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, for example v0.9.0
        required: true
        type: string
      authentication:
        description: Bootstrap new packages with NPM_TOKEN, or use configured trusted publishing
        required: true
        type: choice
        options: [bootstrap, trusted]
        default: trusted

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download and validate published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(" ")')" = 'false false'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern '*.tgz' --pattern artifacts.json --pattern SHA256SUMS
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          node scripts/publish-npm.mjs "$RUNNER_TEMP/release" "$RELEASE_TAG" validate
      - name: Bootstrap packages with a granular npm token
        if: github.event_name == 'workflow_dispatch' && inputs.authentication == 'bootstrap'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test -n "$NPM_TOKEN"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-bootstrap.npmrc"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          node scripts/publish-npm.mjs "$RUNNER_TEMP/release" "$RELEASE_TAG" bootstrap
          rm -f "$NPM_CONFIG_USERCONFIG"
      - name: Publish with npm trusted publishing
        if: github.event_name == 'release' || inputs.authentication == 'trusted'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # These bytes were built before this job, not by the OIDC workflow.
          NPM_CONFIG_PROVENANCE: "false"
        run: node scripts/publish-npm.mjs "$RUNNER_TEMP/release" "$RELEASE_TAG" trusted
